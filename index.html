<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司打卡與請假系統</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select, input, button { width: 100%; padding: 12px; margin-top: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #4CAF50; color: white; border: none; font-size: 16px; cursor: pointer; }
        button.checkout { background: #ff9800; }
        button.leave { background: #2196F3; }
        button:active { opacity: 0.8; }
        label { font-weight: bold; font-size: 14px; color: #333; }
        .version { text-align: right; font-size: 12px; color: #888; margin-top: 15px; }
        
        /* 國定假日加班勾選框樣式 */
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            background: #fff8e1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ffe082;
        }
        .checkbox-container input {
            width: 20px;
            height: 20px;
            margin: 0 10px 0 0;
            cursor: pointer;
        }
        .checkbox-container label {
            cursor: pointer;
            color: #d84315;
            margin: 0;
        }

        /* 載入中遮罩樣式 */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            flex-direction: column;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- 載入中畫面 -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <div>系統正在處理中，請稍候...</div>
</div>

<div class="card">
    <h2>公司打卡系統</h2>
    
    <!-- 員工姓名下拉選單 -->
    <label>請選擇您的姓名：</label>
    <select id="userName">
        <option value="">-- 請選擇名字 --</option>
        <option value="小楓">小楓</option>
        <option value="維恩">維恩</option>
        <option value="Fannie">Fannie</option>
    </select>

    <!-- 新增：國定假日加班勾選框 -->
    <div class="checkbox-container">
        <input type="checkbox" id="holidayOvertime">
        <label for="holidayOvertime">國定假日上班</label>
    </div>

    <button onclick="handleCheckIn()">上班打卡 (GPS定位 + 時段判定)</button>
    <button class="checkout" onclick="handleCheckOut()">下班打卡</button>
    <hr>
    <h3>請假登記</h3>
    
    <!-- 手動輸入假別的欄位 -->
    <label>請輸入假別：</label>
    <input type="text" id="leaveType" placeholder="例如：事假、病假、特休">

    <input type="text" id="leaveNote" placeholder="請假原因（例如：家裡有事、看醫生）">
    <button class="leave" onclick="handleLeave()">請假送出</button>

    <!-- 版本號顯示 -->
    <div class="version">系統版本：v1.2</div>
</div>

<script>
    // ⚠️ 你的 Apps Script 網址
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3y6riAp6UkrJz1Srh0PLJHve9aFkCRAZHsiZYNDrneCkTIYBaqDwTSFaLdD2aHrpJMQ/exec";

    // 👥 各員工的專屬打卡地點設定（半徑 300 公尺）
    const EMPLOYEE_LOCATIONS = {
        "小楓": { lat: 24.961425, lng: 121.224711, radius: 100 },
        "維恩": { lat: 24.961425, lng: 121.224711, radius: 100 },
        "Fannie": { lat: 24.961425, lng: 121.224711, radius: 100 }
    };

    function showLoading() {
        document.getElementById("loadingOverlay").style.display = "flex";
    }

    function hideLoading() {
        document.getElementById("loadingOverlay").style.display = "none";
    }

    function getSelectedName() {
        let select = document.getElementById("userName");
        let name = select.value;
        if (!name) {
            alert("請先選擇您的姓名！");
            return null;
        }
        return name;
    }

    function handleCheckIn() {
        let name = getSelectedName();
        if (!name) return;

        // 檢查是否有勾選「國定假日上班」
        let isHolidayOvertime = document.getElementById("holidayOvertime").checked;

        let targetLoc = EMPLOYEE_LOCATIONS[name] || { lat: 24.961425, lng: 121.224711, radius: 300 };

        if (!navigator.geolocation) {
            alert("您的瀏覽器不支援定位功能");
            return;
        }

        showLoading();

        navigator.geolocation.getCurrentPosition(function(position) {
            let userLat = position.coords.latitude;
            let userLng = position.coords.longitude;
            let distance = calculateDistance(userLat, userLng, targetLoc.lat, targetLoc.lng);

            if (distance > targetLoc.radius) {
                hideLoading();
                alert("打卡失敗：您目前距離指定地點約 " + Math.round(distance) + " 公尺，超出 " + targetLoc.radius + " 公尺的打卡範圍！");
                return;
            }

            let now = new Date();
            let hour = now.getHours();
            let minute = now.getMinutes();
            let totalMinutes = hour * 60 + minute; 
            
            let workStartTime = 9 * 60;          // 09:00 = 540分
            let t930 = 9 * 60 + 30;              // 09:30 = 570分
            let t1000 = 10 * 60;                 // 10:00 = 600分
            let t1100 = 11 * 60;                 // 11:00 = 660分

            let status = "正常";
            let actionType = "checkin";
            let note = "";

            // 如果有勾選國定假日上班，狀態直接設為「國定假日上班」
            if (isHolidayOvertime) {
                status = "國定假日上班";
            } else {
                // 僅針對「小楓」或「周傳芸」進行 09:00 後的時段逾時判定
                if (name === "小楓") {
                    if (totalMinutes >= t930 && totalMinutes < t1000) {
                        let wantLeave = confirm("目前時間在 09:30 - 10:00 之間，是否要登記為「事假一小時」？\n\n[確定] 登記事假一小時\n[取消] 登記為遲到");
                        if (wantLeave) {
                            status = "事假一小時";
                            note = "09:30-10:00 逾時轉事假一小時";
                        } else {
                            status = "遲到";
                        }
                    } 
                    else if (totalMinutes >= t1000 && totalMinutes < t1100) {
                        let wantLeave = confirm("目前時間在 10:00 - 11:00 之間，是否要登記為「事假兩小時」？\n\n[確定] 登記事假兩小時\n[取消] 登記為遲到");
                        if (wantLeave) {
                            status = "事假兩小時";
                            note = "10:00-11:00 逾時轉事假兩小時";
                        } else {
                            status = "遲到";
                        }
                    } 
                    else if (totalMinutes >= t1100) {
                        let wantLeave = confirm("目前時間已超過 11:00，是否要登記為事假？\n\n[確定] 登記事假\n[取消] 登記為遲到");
                        if (wantLeave) {
                            status = "事假";
                            note = "11:00後逾時轉事假";
                        } else {
                            status = "遲到";
                        }
                    } 
                    else if (totalMinutes > workStartTime) {
                        status = "正常(彈性)";
                    }
                } else {
                    status = "正常";
                }
            }
            
            sendData({ name: name, action: actionType, status: status, note: note });

        }, function(error) {
            hideLoading();
            alert("無法取得定位，請確認手機是否有開啟 GPS 權限！");
        }, { enableHighAccuracy: true });
    }

    function handleCheckOut() {
        let name = getSelectedName();
        if (!name) return;
        showLoading();
        sendData({ name: name, action: "checkout", status: "下班打卡", note: "" });
    }

    function handleLeave() {
        let name = getSelectedName();
        if (!name) return;
        
        let leaveTypeInput = document.getElementById("leaveType").value.trim();
        let leaveType = leaveTypeInput !== "" ? leaveTypeInput : "事假";
        
        let reason = document.getElementById("leaveNote").value.trim();
        let finalNote = reason ? "原因：" + reason : "";

        showLoading();
        sendData({ name: name, action: "leave", status: leaveType, note: finalNote });
    }

    function sendData(payload) {
        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            hideLoading();
            alert("動作已成功送出！");
            location.reload();
        }).catch(error => {
            hideLoading();
            alert("送出失敗，請檢查網路連線。");
            console.error(error);
        });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        let R = 6371000;
        let dLat = (lat2 - lat1) * Math.PI / 180;
        let dLon = (lon2 - lon1) * Math.PI / 180;
        let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
</script>

</body>
</html>
